# ==============================================================================
#  Grafana Datasource Provisioning
#  infrastructure/grafana/provisioning/datasources/datasources.yml
#
#  Thay vì setup datasource thủ công qua Grafana UI mỗi lần tạo container mới,
#  file này tự động provision datasources khi Grafana khởi động.
#  → Infrastructure as Code: config trong code, không phải click UI
# ==============================================================================

apiVersion: 1

datasources:
  # Prometheus — metrics primary datasource
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: '15s'       # phải match với scrape_interval trong prometheus.yml
      queryTimeout: '60s'
      httpMethod: POST

  # OpenSearch — logs datasource
  - name: OpenSearch
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch:9200
    editable: false
    jsonData:
      database: 'ecommerce-logs-*'    # index pattern
      timeField: '@timestamp'
      flavor: OpenSearch
      version: '2.11.0'
      logMessageField: message
      logLevelField: level
