apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/user-service
  - ../../base/product-service
  - ../../base/order-service

patches:
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3              # Production chạy 3 replicas thay vì 2