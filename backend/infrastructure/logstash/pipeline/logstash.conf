# ==============================================================================
#  Logstash Pipeline Configuration
#  infrastructure/logstash/pipeline/logstash.conf
#
#  LUỒNG XỬ LÝ (Pipeline):
#
#  [App Services] → stdout (JSON logs)
#       ↓
#  [Filebeat - sẽ thêm Phase 5] — đọc container logs, gửi đến Logstash
#       ↓
#  [Logstash: INPUT] — nhận logs từ Beats port 5044
#       ↓
#  [Logstash: FILTER] — parse, transform, enrich
#       ↓
#  [Logstash: OUTPUT] — gửi đến OpenSearch
#       ↓
#  [OpenSearch Dashboards] — visualize, search, alert
#
#  Mỗi service nên log theo JSON format để Logstash parse dễ hơn:
#  {
#    "timestamp": "2024-01-15T10:30:00Z",
#    "level": "ERROR",
#    "service": "user-service",
#    "message": "Failed to authenticate user",
#    "user_id": "123",
#    "trace_id": "abc-def-ghi"    ← Distributed tracing ID
#  }
# ==============================================================================

input {
  # Beats: nhận logs từ Filebeat agents
  beats {
    port => 5044
    codec => json     # nếu Filebeat đã encode JSON
  }

  # TCP: nhận logs trực tiếp (useful cho testing)
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # ============================================================================
  # Bước 1: Parse JSON logs nếu message là JSON string
  # ============================================================================
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "parsed"
      remove_field => ["message"]
    }

    # Flatten parsed fields lên root level
    mutate {
      rename => {
        "[parsed][level]"     => "level"
        "[parsed][service]"   => "service"
        "[parsed][message]"   => "message"
        "[parsed][trace_id]"  => "trace_id"
        "[parsed][user_id]"   => "user_id"
      }
    }
  }

  # ============================================================================
  # Bước 2: Normalize log levels
  # ============================================================================
  mutate {
    uppercase => ["level"]    # đảm bảo level luôn viết hoa: INFO, ERROR, ...
  }

  # ============================================================================
  # Bước 3: Parse timestamp
  # ============================================================================
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSZ"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }

  # ============================================================================
  # Bước 4: Thêm metadata hữu ích
  # ============================================================================
  mutate {
    add_field => {
      "environment" => "${ENVIRONMENT:local}"
    }
  }

  # Drop debug logs ở production để tiết kiệm storage
  if [level] == "DEBUG" and "${ENVIRONMENT:local}" != "local" {
    drop {}
  }
}

output {
  # ============================================================================
  # Output chính: OpenSearch
  # Logstash 7.x dùng elasticsearch output, compatible với OpenSearch API
  # ============================================================================
  elasticsearch {
    hosts => ["http://${OPENSEARCH_HOST:opensearch:9200}"]

    # Index pattern theo ngày: ecommerce-logs-2024.01.15
    # → Dễ quản lý: có thể xóa index cũ theo thời gian (Index Lifecycle Management)
    index => "ecommerce-logs-%{[service]:unknown}-%{+YYYY.MM.dd}"

    # Template tự động tạo mapping cho fields
    manage_template => false

    # Retry logic khi OpenSearch không available
    retry_on_conflict => 3
  }

  # Debug: in logs ra console (chỉ bật khi cần debug pipeline)
  # stdout {
  #   codec => rubydebug
  # }
}
