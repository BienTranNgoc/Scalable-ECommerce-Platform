# ==============================================================================
#  prometheus.yml — Prometheus Scrape Configuration
#
#  Prometheus hoạt động theo mô hình PULL:
#  → Prometheus chủ động "scrape" (lấy) metrics từ target theo interval
#  → Khác với push model (Datadog, StatsD) — target chủ động gửi metrics
#
#  Mỗi microservice sẽ expose endpoint GET /metrics trả về format Prometheus
#  Ví dụ: http_requests_total{method="GET", status="200", path="/products"} 1234
#
#  Metrics Types:
#  → Counter: chỉ tăng (total requests, total errors)
#  → Gauge: tăng/giảm (current connections, memory usage)
#  → Histogram: phân phối giá trị (request duration buckets)
#  → Summary: tương tự Histogram nhưng tính quantile phía client
# ==============================================================================

global:
  # Scrape mỗi 15 giây — balance giữa granularity và overhead
  scrape_interval: 15s
  # Evaluate alerting rules mỗi 15 giây
  evaluation_interval: 15s
  # Labels được thêm vào mọi time series
  external_labels:
    environment: 'local'
    project: 'ecommerce-platform'

# Alerting: kết nối với Alertmanager (sẽ setup ở Phase 5)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Rule files: chứa alerting rules và recording rules
# rule_files:
#   - '/etc/prometheus/rules/*.yml'

# ==============================================================================
# SCRAPE CONFIGS — Danh sách targets Prometheus sẽ scrape
# ==============================================================================

scrape_configs:

  # Prometheus tự monitor chính nó
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Infrastructure Services
  - job_name: 'kong'
    static_configs:
      - targets: ['kong:8001']    # Kong Admin API expose Prometheus metrics
    metrics_path: /metrics

  - job_name: 'postgres'
    # postgres-exporter: sidecar container chuyển đổi PG stats → Prometheus format
    # Sẽ thêm postgres-exporter container ở Phase 5
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    # redis-exporter: tương tự, export Redis metrics
    static_configs:
      - targets: ['redis-exporter:9121']

  # ===========================================================================
  # Application Microservices — Sẽ được uncomment khi code từng service (Phase 2)
